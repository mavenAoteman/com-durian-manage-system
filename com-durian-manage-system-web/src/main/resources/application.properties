################################################################################
##                                                                            ##
##                                  app config                                ##
##                                                                            ##
################################################################################
# \u5E94\u7528\u540D\u79F0
spring.application.name=com-durian-manage-system
# Profile\u73AF\u5883\u914D\u7F6E
spring.profiles.active=@profiles.active@
# \u7F16\u7801\u914D\u7F6E
spring.http.encoding.charset=UTF-8
spring.http.encoding.force=true
spring.http.encoding.enabled=true
server.port=8080
################################################################################
##                                                                            ##
##                                \u65E5\u5FD7 \u901A\u7528\u914D\u7F6E                                ##
##                                                                            ##
################################################################################
# Logback\u901A\u7528\u914D\u7F6E
logging.config=classpath:logback-spring.xml
spring.output.ansi.enabled=always

################################################################################
##                                                                            ##
##                               log config                                   ##
##                                                                            ##
################################################################################
log.file.logpath=./logs
log.file.minindex=1
log.file.maxindex=10
log.file.maxfilesize=1GB

################################################################################
##                                                                            ##
##                               mysql \u901A\u7528\u914D\u7F6E                                 ##
##                                                                            ##
################################################################################
spring.datasource.druid.url=jdbc:mysql://127.0.0.1:3306/durian?characterEncoding=utf-8&allowMultiQueries=true&zeroDateTimeBehavior=convertToNull&connectTimeout=5000&socketTimeout=5000&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.druid.username=${MYSQL_USER:root}
spring.datasource.druid.password=${MYSQL_PASSWORD:}

################################################################################
##                                                                            ##
##                               UMP \u901A\u7528\u914D\u7F6E                                  ##
##                                                                            ##
################################################################################


################################################################################
##                                                                            ##
##                               JWT \u914D\u7F6E                                          ##
##                                                                            ##
################################################################################
# JWT \u7B7E\u540D\u5BC6\u94A5\uFF08\u5FC5\u987B >= 32 \u5B57\u8282\uFF09\u3002\u751F\u4EA7\u73AF\u5883\u8BF7\u4ECE\u73AF\u5883\u53D8\u91CF\u6216\u4E2D\u95F4\u4EF6\u6CE8\u5165\uFF0C\u4E0D\u8981\u63D0\u4EA4\u5230\u4ED3\u5E93\u3002
jwt.secret=${JWT_SECRET:please-change-this-to-a-32-byte-secret-in-production}
# token \u6709\u6548\u671F\uFF08\u79D2\uFF09\uFF0C\u9ED8\u8BA4 2 \u5C0F\u65F6
jwt.expire-seconds=7200

################################################################################
##                                                                            ##
##                               \u5176\u4ED6 \u901A\u7528\u914D\u7F6E                                 ##
##                                                                            ##
################################################################################